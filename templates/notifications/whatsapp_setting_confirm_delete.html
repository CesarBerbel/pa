{% extends "base.html" %}

{% block title %}Apagar mensagem | Priscila Arantes PA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-6">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h5 mb-3">Apagar esta mensagem?</h1>

                <p class="mb-1"><strong>{{ object }}</strong></p>

                <p class="text-muted small">
                    Deixa de ser enviada. Se for só temporário, desligue-a em
                    vez de a apagar — assim o texto não se perde.
                </p>

                <form method="post" class="d-flex gap-2 mt-4">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">Apagar</button>

                    <a href="{% url 'notifications:whatsapp_setting_list' %}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
